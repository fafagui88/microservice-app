version: '3.8'

services:
  # 1. EUREKA SERVER (Service Registry) - Harus Up Pertama
  eureka-server:
    build: 
      context: ./eureka-server        # Docker akan mencari file DOCKERFILE di folder ini
    container_name: eureka-server
    # Port untuk memantau Dashboard Eureka di host (localhost:8761)
    ports:
      - "8761:8761"
    networks:
      - microservice-network

  # 2. PRODUCT SERVICE (Provider)
  product-service:
    build: 
      context: ./product-service      # Docker akan mencari file DOCKERFILE di folder ini
    container_name: product-service
    # Port 9092:8082 - Akses dari host ke service ini (opsional)
    ports:
      - "9092:8082" 
    environment:
      # PENTING: Komunikasi INTERNAL menggunakan nama service Docker 'eureka-server'
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SERVER_PORT: 8082 
    depends_on:
      - eureka-server                 
    networks:
      - microservice-network

  # 3. ORDER SERVICE (Consumer/Pemanggil)
  order-service:
    build: 
      context: ./order-service        # Docker akan mencari file DOCKERFILE di folder ini
    container_name: order-service
    # Port utama yang akan diakses dari luar (Client/Browser)
    ports:
      - "9091:8081"
    environment:
      # PENTING: Komunikasi INTERNAL menggunakan nama service Docker 'eureka-server'
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SERVER_PORT: 8081 
    depends_on:
      - eureka-server
      - product-service               
    networks:
      - microservice-network

networks:
  microservice-network:
    driver: bridge 
