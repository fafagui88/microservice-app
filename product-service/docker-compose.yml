version: '3.8'

services:
  discovery-server:
    image: microservice-discovery-server
    container_name: discovery-server
    ports:
      - "8761:8761"
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  product-service:
    image: microservice-app-product-service
    container_name: product-service
    ports:
      - "8081:8081"
    depends_on:
      discovery-server:
        condition: service_healthy
      product-db:
        condition: service_started
    entrypoint: ["sh", "-c", "sleep 30 && java -jar /app/app.jar"]
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
    networks:
      - microservice-network

  order-service:
    image: microservice-app-order-service
    container_name: order-service
    ports:
      - "8082:8082"
    depends_on:
      discovery-server:
        condition: service_healthy
      order-db:
        condition: service_started
    entrypoint: ["sh", "-c", "sleep 30 && java -jar /app/app.jar"]
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
    networks:
      - microservice-network

# 🚀 Volume dan Network harus di level root, bukan di dalam services
volumes:
  product_data:
  order_data:

networks:
  microservice-network:
